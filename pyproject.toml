[project]
name = "humphrey"
version = "0.1.0"
description = "Humphrey: a streaming, tool-calling agent with skills, built on FastAPI + SSE."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "openai==1.99.9",
    "pydantic>=2.11",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "pillow>=11.0.0",
]

[dependency-groups]
# Optional Azure adapters: Azure OpenAI provider and Azure Blob session storage.
azure = [
    "azure-identity==1.23.1",
    "azure-storage-blob==12.26.0",
]
dev = [
    {include-group = "azure"},
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.uv]
package = false
# Plain `uv sync` installs only what's needed to run on OpenAI.
default-groups = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
